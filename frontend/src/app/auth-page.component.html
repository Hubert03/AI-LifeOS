<main class="auth-layout" [class.theme-light]="!isDarkTheme()" [attr.data-theme]="themeService.theme()">
  <section class="auth-card" aria-labelledby="auth-heading">
    <a class="brand" routerLink="/" aria-label="AI LifeOS home">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span>AI LifeOS</span>
    </a>

    <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
    <h1 id="auth-heading">Welcome back</h1>
    <p class="intro">
      Sign in to continue to your LifeOS.
    </p>

    @if (errorMessage()) {
      <div class="error-message" role="alert">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="submit()" #authForm="ngForm">
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        [(ngModel)]="email"
        required
        maxlength="256"
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        required
        minlength="1"
        maxlength="128"
      />
<!-- Find your button and update it to this: -->
<button
  type="submit"
  [disabled]="isSubmitting()"
  class="w-full rounded-md bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 disabled:opacity-50"
>
  @if (isSubmitting()) {
    Signing in...
  } @else {
    Sign in
  }
</button>
      <!-- <button
        class="submit-button"
        type="submit"
        [disabled]="!csrfReady() || isSubmitting() || !authForm.valid"
      >
        {{ isSubmitting() ? 'Please wait…' : 'Sign in' }}
      </button> -->
    </form>

    <p class="switch-mode">Accounts are provisioned by your AI LifeOS administrator.</p>
  </section>
</main>
